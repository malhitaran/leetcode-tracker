<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeetCode">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>LeetCode Tracker</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c232d; --line:#2a3340; --line2:#3a4654;
  --txt:#e6edf3; --mut:#8b98a9; --mut2:#6b7787;
  --acc:#7c5cff; --acc2:#9d86ff; --accbg:rgba(124,92,255,.14);
  --easy:#3fb950; --med:#d29922; --hard:#f85149;
  --due:#f0883e; --ok:#3fb950; --weak:#f85149; --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer} a{color:var(--acc2);text-decoration:none} a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 22px;height:58px;background:rgba(13,17,23,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand .bolt{color:var(--acc2)} .brand .user{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
.tabs{display:flex;gap:2px;margin-left:4px;flex-wrap:wrap}
.tab{background:none;border:none;color:var(--mut);padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--txt);background:var(--bg2)} .tab.active{color:var(--txt);background:var(--accbg)}
.spacer{flex:1}
.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--mut);padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:600}
.ghost:hover{color:var(--txt);border-color:var(--line2)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;background:var(--due);color:#1a1206}
.badge.hide{display:none} .badge.acc{background:var(--acc);color:#fff}
main{max-width:1080px;margin:0 auto;padding:26px 22px 80px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px}
.h{font-size:18px;font-weight:700;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.dashhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dashhead .lh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.listsel{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-weight:700;font-size:14px;padding:9px 13px;border-radius:10px;outline:none;cursor:pointer}
.listsel:focus{border-color:var(--acc)}
.lifebadge{display:inline-flex;align-items:center;gap:7px;background:var(--accbg);border:1px solid rgba(124,92,255,.3);color:var(--acc2);font-weight:800;font-size:14px;padding:8px 14px;border-radius:22px}
.lifebadge .ln{color:var(--mut);font-weight:600;font-size:12px}
.syncbanner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--accbg),rgba(124,92,255,.02));border:1px solid rgba(124,92,255,.3);border-radius:12px;padding:13px 16px;margin:0 0 18px}
.syncbanner .bt{flex:1;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:600;margin-top:7px}
.stat .accent{position:absolute;right:-10px;top:-10px;font-size:64px;opacity:.07}
.stat.due .n{color:var(--due)} .stat.weak .n{color:var(--weak)} .stat.streak .n{color:var(--acc2)} .stat.solved .n{color:var(--ok)}
.hero{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center;margin-top:14px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:180px;height:180px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid .big{font-size:38px;font-weight:800;letter-spacing:-1px}
.ring .mid .small{color:var(--mut);font-size:12px;font-weight:600}
.bignum{text-align:center} .bignum .bn{font-size:52px;font-weight:800;letter-spacing:-2px;color:var(--ok)} .bignum .bl{color:var(--mut);font-size:13px;font-weight:600}
.diffbars{display:flex;flex-direction:column;gap:14px}
.diffrow{display:flex;align-items:center;gap:12px}
.diffrow .lab{width:64px;font-size:13px;font-weight:700}
.diffrow .lab.Easy{color:var(--easy)} .diffrow .lab.Medium{color:var(--med)} .diffrow .lab.Hard{color:var(--hard)}
.bar{flex:1;height:9px;background:var(--bg3);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px}
.diffrow .cnt{width:66px;text-align:right;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.patgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.patcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .15s}
.patcard:hover{border-color:var(--acc)}
.patcard .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.patcard .name{font-weight:700;font-size:13.5px} .patcard .frac{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums} .patcard.done .frac{color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.filters input[type=text],.filters select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:9px;font-size:13px;outline:none}
.filters input[type=text]{min-width:210px} .filters input:focus,.filters select:focus{border-color:var(--acc)}
.grouphdr{display:flex;align-items:center;gap:10px;margin:22px 0 9px;font-weight:700;font-size:14px}
.grouphdr .gfrac{color:var(--mut);font-size:12px;font-weight:600}
.grouphdr .gbar{flex:1;max-width:160px;height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.grouphdr .gbar>i{display:block;height:100%;background:var(--acc);border-radius:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;transition:border-color .12s,background .12s}
.row:hover{border-color:var(--line2);background:var(--bg3)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--mut2)}
.dot.attempted{background:var(--med)} .dot.solved{background:var(--ok)}
.row .nm{font-weight:600;font-size:13.5px;flex-shrink:0}
.row .trig{color:var(--mut);font-size:12px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.row .meta{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap}
.tag.Easy{color:var(--easy);background:rgba(63,185,80,.12)} .tag.Medium{color:var(--med);background:rgba(210,153,34,.12)} .tag.Hard{color:var(--hard);background:rgba(248,81,73,.12)}
.tag.q-clean{color:var(--ok);background:rgba(63,185,80,.12)} .tag.q-scrappy{color:var(--med);background:rgba(210,153,34,.12)} .tag.q-missed{color:var(--hard);background:rgba(248,81,73,.12)}
.tag.due{color:var(--due);background:rgba(240,136,62,.14)} .tag.soon{color:var(--mut);background:var(--bg3)} .tag.note{color:var(--acc2);background:var(--accbg)}
.tag.l75{color:#58a6ff;background:rgba(88,166,255,.12)}
.ext{color:var(--mut2);font-size:13px} .ext:hover{color:var(--acc2);text-decoration:none}
.empty{text-align:center;padding:48px 20px;color:var(--mut)} .empty .em{font-size:40px;margin-bottom:10px}
.qcard{display:flex;align-items:center;gap:14px;padding:15px 17px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.qcard.over{border-left:3px solid var(--due)} .qcard .info{flex:1;min-width:0}
.qcard .info .t{font-weight:700;font-size:14px} .qcard .info .d{color:var(--mut);font-size:12px;margin-top:3px}
.qcard .when{font-size:12px;font-weight:700;color:var(--due);white-space:nowrap}
.btn{background:var(--acc);border:none;color:#fff;padding:8px 15px;border-radius:9px;font-weight:700;font-size:13px} .btn:hover{background:var(--acc2)}
.btn.sm{padding:6px 12px;font-size:12.5px} .btn.ghostbtn{background:var(--bg3);color:var(--txt);border:1px solid var(--line2)} .btn.ghostbtn:hover{background:var(--line)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal-backdrop.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:660px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.mhead{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
.mhead .x{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--mut);font-size:22px;line-height:1} .mhead .x:hover{color:var(--txt)}
.mhead h2{margin:0 0 9px;font-size:19px;padding-right:30px} .mhead .row2{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mbody{padding:18px 22px 22px;display:flex;flex-direction:column;gap:18px;max-height:74vh;overflow:auto}
.fieldlabel{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ob{border:1px solid var(--line2);background:var(--bg3);border-radius:11px;padding:12px 8px;text-align:center;transition:.12s} .ob:hover{transform:translateY(-1px)}
.ob .ic{font-size:18px} .ob .nm{font-weight:700;font-size:13px;margin-top:3px} .ob .sub{font-size:10.5px;color:var(--mut);margin-top:2px;font-weight:600}
.ob.miss:hover{border-color:var(--hard);background:rgba(248,81,73,.1)} .ob.scr:hover{border-color:var(--med);background:rgba(210,153,34,.1)} .ob.cln:hover{border-color:var(--ok);background:rgba(63,185,80,.1)}
textarea,.modal input[type=text],.modal input[type=password],.modal input[type=date],.modal select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;resize:vertical}
textarea:focus,.modal input:focus,.modal select:focus{border-color:var(--acc)}
.trigbox{background:var(--accbg);border:1px solid rgba(124,92,255,.3)} .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.nextline{font-size:12.5px;color:var(--mut);margin-top:9px} .nextline b{color:var(--acc2)}
.logtable{width:100%;border-collapse:collapse;font-size:12.5px}
.logtable th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.logtable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.logtable .o-clean{color:var(--ok);font-weight:700} .logtable .o-scrappy{color:var(--med);font-weight:700} .logtable .o-missed{color:var(--hard);font-weight:700}
.hintbox{font-size:12.5px;color:var(--mut);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut2);margin-right:6px;vertical-align:middle;flex:none}
.syncdot.ok{background:var(--ok)} .syncdot.busy{background:var(--due);animation:sdp 1s ease-in-out infinite} .syncdot.err{background:var(--hard)}
@keyframes sdp{50%{opacity:.3}}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.minor{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .minor label{font-size:12px;color:var(--mut);font-weight:600}
.helps{display:flex;gap:8px;flex-wrap:wrap}
.help{border:1px solid var(--line2);background:var(--bg3);color:var(--mut);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700}
.help.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2)}
.timer{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.timer .tdisp{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;min-width:74px}
.timer .tbtn{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:6px 11px;font-weight:700;font-size:12.5px} .timer .tbtn:hover{border-color:var(--acc)}
.tnudge{color:var(--due);font-weight:700;font-size:12.5px} .tnudge.flash{animation:blink 1s ease infinite} @keyframes blink{50%{opacity:.4}}
.floor{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.floor td{border:1px solid var(--line);padding:7px 10px}
.floor td:first-child{color:var(--txt);font-weight:700;white-space:nowrap;width:40%} .floor td:last-child{color:var(--acc2);font-family:ui-monospace,Menlo,monospace}
details.floorbox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
details.floorbox summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--txt);padding:7px 0;list-style:none} details.floorbox summary::-webkit-details-marker{display:none}
details.floorbox summary:before{content:"▸ ";color:var(--acc2)} details.floorbox[open] summary:before{content:"▾ "}
.drillbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.flash{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:34px 28px;text-align:center;max-width:620px;margin:8px auto;box-shadow:var(--shadow)}
.flash .fq{font-size:13px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.flash .fname{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:12px}
.flash .frow{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.flash .ans{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.flash .ans .al{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc2);margin-bottom:6px}
.flash .ans .av{font-size:15px;line-height:1.6;white-space:pre-wrap} .flash .ans .av.empty{color:var(--mut2);font-style:italic}
.drillbtns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dbtn{border:none;border-radius:11px;padding:13px 26px;font-weight:800;font-size:14px;color:#fff} .dbtn.no{background:var(--hard)} .dbtn.no:hover{filter:brightness(1.1)} .dbtn.yes{background:var(--ok)} .dbtn.yes:hover{filter:brightness(1.1)}
.dprog{color:var(--mut);font-size:12.5px;font-weight:700}
.libitem{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .12s} .libitem:hover{border-color:var(--acc)}
.libitem .lt{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap} .libitem .lt .lname{font-weight:700;font-size:14px}
.libitem .ltrig{background:var(--accbg);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13px;margin-bottom:6px}
.libitem .lnotes{color:var(--mut);font-size:12.5px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.insbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.insbox h4{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.forecast{display:flex;align-items:flex-end;gap:8px;height:90px}
.fday{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.fday .fbar{width:100%;max-width:30px;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px} .fday .fbar.today{background:var(--due)}
.fday .fn{font-size:11px;font-weight:700;color:var(--mut)} .fday .fc{font-size:11px;font-weight:800}
.indep{display:flex;align-items:center;gap:14px}
.indep .gring{position:relative;width:84px;height:84px;flex-shrink:0} .indep .gmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.weaklist{display:flex;flex-direction:column;gap:9px}
.weakrow{display:flex;align-items:center;gap:10px;font-size:13px} .weakrow .wn{flex:1;font-weight:600}
.weakrow .wbar{width:90px;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden} .weakrow .wbar>i{display:block;height:100%;background:var(--hard);border-radius:4px}
.weakrow .wv{color:var(--mut);font-size:11.5px;width:60px;text-align:right}
.method{max-width:760px}
.method h2{font-size:17px;margin:26px 0 8px} .method h1{font-size:22px;margin:0 0 6px}
.method p,.method li{color:#c9d4e0;font-size:14px}
.method blockquote{border-left:3px solid var(--acc);margin:14px 0;padding:6px 16px;color:var(--mut);background:var(--bg2);border-radius:0 8px 8px 0}
.method code{background:var(--bg3);padding:2px 6px;border-radius:5px;font-size:12.5px;color:var(--acc2)}
.method table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.method th,.method td{border:1px solid var(--line);padding:8px 11px;text-align:left} .method th{background:var(--bg2);color:var(--mut)} .method td:last-child{font-family:ui-monospace,Menlo,monospace;color:var(--acc2)}
.loop{counter-reset:s;list-style:none;padding:0} .loop li{position:relative;padding:10px 0 10px 44px;border-bottom:1px solid var(--line)}
.loop li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;background:var(--accbg);color:var(--acc2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.patgrid{grid-template-columns:1fr}.ins{grid-template-columns:1fr}main{padding:18px 14px 60px}}

/* ---------------- phone layout ---------------- */
@media(max-width:720px){
  .topbar{height:auto;min-height:0;padding:calc(7px + env(safe-area-inset-top)) 10px 0;gap:7px;row-gap:7px;align-items:center}
  .brand{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;order:1}
  .brand .bn2,.brand .user{display:none}
  .spacer{display:none}
  #cloudBtn,#syncBtn,#exportBtn,#importBtn{order:2;padding:8px 9px;font-size:11.5px;min-height:36px}
  #cloudBtn #syncLbl{display:none}
  #syncBtn{font-size:0;padding:8px 10px}
  #syncBtn::before{content:"\21BB";font-size:14px}
  .tabs{order:3;flex-basis:100%;width:100%;margin:0;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:0 0 5px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;min-height:40px;padding:9px 13px;font-size:13.5px}

  main{max-width:none;padding:16px 12px calc(64px + env(safe-area-inset-bottom))}
  body{font-size:15px}

  .dashhead{margin-bottom:12px}
  .listsel{font-size:16px;padding:10px 12px;flex:1;min-width:0}
  .lifebadge{font-size:13px;padding:7px 12px}

  .hero{grid-template-columns:1fr;gap:18px;margin-top:12px}
  .ring{width:158px;height:158px}
  .ring .mid .big{font-size:33px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px 14px}
  .stat .n{font-size:25px}
  .stat .l{font-size:11.5px;margin-top:5px}
  .stat .accent{font-size:52px}
  .patgrid{grid-template-columns:1fr}
  .ins{grid-template-columns:1fr}
  .card{padding:15px}
  .section-title{margin:24px 0 10px}

  /* iOS zooms the page when a control smaller than 16px gets focus */
  .filters{gap:8px}
  .filters input[type=text]{min-width:0;flex:1 1 100%;width:100%;font-size:16px;padding:10px 12px}
  .filters select{flex:1 1 calc(50% - 4px);min-width:0;font-size:16px;padding:10px 12px}

  .grouphdr{margin:20px 0 8px}
  .grouphdr .gbar{max-width:none}

  .row{flex-wrap:wrap;padding:12px 13px;gap:7px;min-height:46px}
  .row .nm{flex:1 1 auto;min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .trig{order:9;flex:1 1 100%;min-width:100%;white-space:normal;font-size:12px;line-height:1.45}
  .row .meta{margin-left:auto;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  .qcard{flex-wrap:wrap;gap:10px;padding:14px}
  .qcard .info{flex:1 1 100%;order:2}
  .qcard .when{order:3}
  .qcard .btn{order:4;margin-left:auto;min-height:38px}

  .btn{min-height:40px;padding:10px 15px}
  .btn.sm{min-height:34px;padding:8px 12px}
  .ghost{min-height:36px}

  .flash{padding:26px 18px}
  .flash .fname{font-size:21px}

  /* modal becomes a bottom sheet */
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal{max-width:none;width:100%;border-radius:18px 18px 0 0;max-height:93vh;display:flex;flex-direction:column}
  .mhead{padding:17px 16px 14px;flex:none}
  .mhead h2{font-size:17px}
  .mhead .x{top:13px;right:14px;font-size:26px;padding:4px 8px}
  .mbody{max-height:none;flex:1 1 auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));gap:15px}
  textarea,.modal input[type=text],.modal input[type=password],.modal input[type=date],.modal select{font-size:16px}
  .floor td{padding:6px 8px;font-size:12px}
}
@media(max-width:360px){
  .stats{grid-template-columns:1fr}
  #exportBtn,#importBtn{padding:8px 7px;font-size:11px}
}

/* date helpers */
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return fmt(new Date());}
function addDays(iso,n){const[y,m,d]=iso.split("-").map(Number);return fmt(new Date(y,m-1,d+n,12));}
function daysUntil(iso){if(!iso)return null;const[y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d,12);const n=new Date();n.setHours(12,0,0,0);return Math.round((t-n)/864e5);}
function relDate(iso){const d=daysUntil(iso);if(d===null)return"";if(d<0)return Math.abs(d)+"d overdue";if(d===0)return"due today";if(d===1)return"tomorrow";return"in "+d+"d";}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* state + dynamic catalog */
let state={}, extraCat={};
function load(){
  const raw=localStorage.getItem(KEY);
  state = raw?JSON.parse(raw):seedState();
  extraCat = JSON.parse(localStorage.getItem(CKEY)||"{}");
  activeList = localStorage.getItem(LKEY)||"neetcode150";
  if(!LISTS[activeList])activeList="neetcode150";
}
function seedState(){const s={};for(const slug in SEED){const d=SEED[slug];s[slug]={status:"solved",quality:"",firstSolved:d,lastReviewed:d,nextReview:addDays(d,7),reviewCount:1,attempts:1,cleanStreak:0,log:[{date:d,outcome:"",help:"",note:"pulled from your LeetCode account — re-solve from blank to grade"}]};}localStorage.setItem(KEY,JSON.stringify(s));return s;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));scheduleSync();}
function saveCat(){localStorage.setItem(CKEY,JSON.stringify(extraCat));}
function saveList(){localStorage.setItem(LKEY,activeList);}
const DEF={status:"not-started",quality:"",trigger:"",notes:"",timeC:"",spaceC:"",predictedC:"",attempts:0,reviewCount:0,cleanStreak:0,firstSolved:null,lastReviewed:null,nextReview:null,lastHelp:"",lastDrilled:null,drillStreak:0,log:[]};
let CAT=[], BY={};
function buildCat(){
  CAT=[];BY={};
  CAT250.forEach(c=>{CAT.push(c);BY[c.slug]=c;});
  for(const slug in extraCat){if(BY[slug])continue;const e=extraCat[slug];
    const o={slug,name:e.n||slug,url:"https://leetcode.com/problems/"+slug+"/",difficulty:e.d||"",diffRank:DR[e.d]||2,pattern:"",order:999,seq:99999,b75:false,n150:false,n250:false,lc75:false};
    CAT.push(o);BY[slug]=o;}
}
function get(slug){return Object.assign({},DEF,BY[slug]||{slug,name:slug,url:"https://leetcode.com/problems/"+slug+"/",difficulty:"",pattern:"",b75:false,n150:false,n250:false,lc75:false},state[slug]||{});}
function all(){return CAT.map(c=>Object.assign({},DEF,c,state[c.slug]||{}));}
function mut(slug,fn){const cur=Object.assign({},DEF,state[slug]||{});fn(cur);cur.mtime=nowTs();state[slug]=cur;save();}
function inList(p){return LISTS[activeList].test(p);}

/* ingest */
function ingestCatalog(arr){if(!arr)return;arr.forEach(x=>{const s=x.s||x.slug;if(s)extraCat[s]={n:x.t||x.n||s,d:x.d||""};});saveCat();buildCat();}
function ingestSolved(slugs){let added=0;const t=today();(slugs||[]).forEach(slug=>{const cur=state[slug];if(!cur||cur.status!=="solved"){const base=Object.assign({},DEF,cur||{});base.status="solved";base.log=[{date:t,outcome:"",help:"",note:"synced from your LeetCode account"}].concat(base.log||[]);base.mtime=nowTs();state[slug]=base;added++;}});save();return added;}

/* spaced repetition */
function intervalFor(o,streak){if(o==="clean")return streak>=4?60:(CLEAN_INT[streak]||60);return 3;}
function logOutcome(slug,outcome,help){const t=today();mut(slug,p=>{let streak=p.cleanStreak||0;streak=(outcome==="clean")?streak+1:0;p.cleanStreak=streak;p.quality=outcome;p.status=(outcome==="missed")?"attempted":"solved";p.attempts=(p.attempts||0)+1;p.reviewCount=(p.reviewCount||0)+1;p.lastReviewed=t;if(help)p.lastHelp=help;if(outcome!=="missed"&&!p.firstSolved)p.firstSolved=t;p.nextReview=addDays(t,intervalFor(outcome,streak));p.log=p.log||[];p.log.unshift({date:t,outcome:outcome,help:help||"",note:""});});}

/* drill */
function drillPool(){return all().filter(p=>p.status==="solved"&&(p.trigger||"").trim());}
function drillSorted(){return drillPool().sort((a,b)=>{if(!a.lastDrilled&&b.lastDrilled)return -1;if(a.lastDrilled&&!b.lastDrilled)return 1;if(a.lastDrilled!==b.lastDrilled)return(a.lastDrilled||"")<(b.lastDrilled||"")?-1:1;return(a.drillStreak||0)-(b.drillStreak||0);});}
function drillDueCount(){const t=today();return drillPool().filter(p=>!p.lastDrilled||p.lastDrilled!==t).length;}
function gradeDrill(slug,ok){const t=today();mut(slug,p=>{p.lastDrilled=t;if(ok){p.drillStreak=(p.drillStreak||0)+1;}else{p.drillStreak=0;p.nextReview=t;p.log=p.log||[];p.log.unshift({date:t,outcome:"",help:"",note:"forgot trigger in drill — owe a re-solve"});}});}

/* stats (scoped to active list) */
function diffCounts(arr){const o={Easy:0,Medium:0,Hard:0};arr.forEach(p=>{if(o[p.difficulty]!==undefined)o[p.difficulty]++;});return o;}
function stats(){
  const a=all();
  const lifetime=a.filter(p=>p.status==="solved").length;
  const lp=a.filter(inList);
  const solved=lp.filter(p=>p.status==="solved");
  const missingTriggers=solved.filter(p=>!(p.trigger||"").trim());
  const due=lp.filter(p=>p.status==="solved"&&p.nextReview&&daysUntil(p.nextReview)<=0);
  const weak=lp.filter(p=>p.quality==="missed"||p.quality==="scrappy");
  const meta=LISTS[activeList];
  const denom=meta.denom||lp.length;
  const byDiff={};["Easy","Medium","Hard"].forEach(d=>{const t=lp.filter(p=>p.difficulty===d);byDiff[d]={s:t.filter(p=>p.status==="solved").length,t:t.length};});
  return{lifetime,lifeDiff:diffCounts(a.filter(p=>p.status==="solved")),lp,solved,missingTriggers,due,weak,denom,fixed:!!meta.denom,label:meta.label,byDiff,total:lp.length};
}
function streakDays(){const set=new Set();for(const s in state){const p=state[s];(p.log||[]).forEach(l=>{if(l.date)set.add(l.date);});if(p.firstSolved)set.add(p.firstSolved);if(p.lastDrilled)set.add(p.lastDrilled);}let n=0,cur=new Date();cur.setHours(12,0,0,0);if(!set.has(fmt(cur))){cur.setDate(cur.getDate()-1);if(!set.has(fmt(cur)))return 0;}while(set.has(fmt(cur))){n++;cur.setDate(cur.getDate()-1);}return n;}
function patStat(pat){const a=all().filter(p=>p.pattern===pat&&inList(p));return{s:a.filter(p=>p.status==="solved").length,t:a.length};}
function forecast(){const days=[];for(let i=0;i<7;i++){const iso=addDays(today(),i);let c;if(i===0)c=all().filter(p=>p.status==="solved"&&inList(p)&&p.nextReview&&daysUntil(p.nextReview)<=0).length;else c=all().filter(p=>p.status==="solved"&&inList(p)&&p.nextReview===iso).length;days.push({iso,c,label:i===0?"Today":new Date(iso.split("-")[0],iso.split("-")[1]-1,iso.split("-")[2],12).toLocaleDateString(undefined,{weekday:"short"})});}return days;}
function weakestPatterns(){return PATTERNS.map(pat=>{const a=all().filter(p=>p.pattern===pat&&inList(p));const bad=a.filter(p=>p.quality==="missed"||p.quality==="scrappy").length;return{pat,bad};}).filter(x=>x.bad>0).sort((a,b)=>b.bad-a.bad).slice(0,5);}
function independence(){const map={alone:1,nudge:0.7,editorial:0.3,solution:0};let tot=0,sum=0;for(const s in state){(state[s].log||[]).forEach(l=>{if(l.help&&map[l.help]!==undefined){tot++;sum+=map[l.help];}});}return tot?{pct:Math.round(sum/tot*100),n:tot}:null;}
function isSynced(){return Object.keys(extraCat).length>0;}

function insightsHTML(){

function qcard(p){const over=daysUntil(p.nextReview)<0;const q=p.quality?`<span class="tag q-${p.quality}">${p.quality}</span>`:"";return `<div class="qcard ${over?"over":""}"><span class="tag ${p.difficulty||"Medium"}">${p.difficulty||"?"}</span><div class="info"><div class="t">${esc(p.name)}</div><div class="d">${esc(p.pattern||"Other")} ${q?"&middot; "+q:""}</div></div><div class="when">${relDate(p.nextReview)}</div><button class="btn sm" data-open="${esc(p.slug)}">Review</button></div>`;}

function viewReview(s){
  const due=s.due.slice().sort((a,b)=>daysUntil(a.nextReview)-daysUntil(b.nextReview));
  const weak=s.weak.filter(p=>!due.includes(p));
  let h=`<div class="dashhead"><div class="lh"><h1 class="h" style="margin:0">Review queue</h1>${listDropdown("revList")}</div></div><p class="sub">What's due in <b>${esc(s.label)}</b> from what you've solved. Re-solve each from a blank file, then grade it.</p>`;

  h+= due.length?due.map(qcard).join(""):`<div class="empty"><div class="em">\u{1F389}</div>All caught up — nothing due in ${esc(s.label)}.</div>`;
  if(weak.length){h+=`<div class="section-title">Weak spots <span class="pill">${weak.length}</span></div>`+weak.map(qcard).join("");}

}

let filt={q:"",pat:"all",status:"all",trigger:"all",diff:"all"};
function viewProblems(){
  let h=`<div class="dashhead"><div class="lh"><h1 class="h" style="margin:0">Problems</h1>${listDropdown("probList")}</div></div><p class="sub">Showing <b>${esc(LISTS[activeList].label)}</b>. Switch the list above; click any problem to open it.</p>

    <select id="fstatus"><option value="all">Any status</option><option value="not-started">Not started</option><option value="attempted">Attempted</option><option value="solved">Solved</option></select>
    <select id="ftrigger"><option value="all">Any trigger status</option><option value="missing">Solved, no trigger written</option><option value="written">Trigger written</option></select>
    <select id="fdiff"><option value="all">Any difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
  </div>`;
  let list=all().filter(inList);
  const q=filt.q.toLowerCase();
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.trigger||"").toLowerCase().includes(q)||(p.notes||"").toLowerCase().includes(q));
  if(filt.pat==="__other")list=list.filter(p=>!p.pattern);
  else if(filt.pat!=="all")list=list.filter(p=>p.pattern===filt.pat);
  if(filt.status!=="all")list=list.filter(p=>p.status===filt.status);
  if(filt.trigger==="missing")list=list.filter(p=>p.status==="solved"&&!(p.trigger||"").trim());
  else if(filt.trigger==="written")list=list.filter(p=>(p.trigger||"").trim());
  if(filt.diff!=="all")list=list.filter(p=>p.difficulty===filt.diff);
  list.sort((a,b)=>(a.pattern?0:1)-(b.pattern?0:1)||a.order-b.order||a.seq-b.seq||a.name.localeCompare(b.name));
  const total=list.length;
  if(!total)return h+`<div class="empty"><div class="em">\u{1F50E}</div>No problems match.${(activeList==="solved"||activeList==="all")&&!isSynced()?"<br>Run <b>Sync</b> to pull your full problem list.":""}</div>`;
  const CAP=400;let capped=false;if(total>CAP){list=list.slice(0,CAP);capped=true;}
  const groups=[];list.forEach(p=>{const k=p.pattern||"Other (outside lists)";if(!groups.includes(k))groups.push(k);});
  for(const pat of groups){
    const items=list.filter(p=>(p.pattern||"Other (outside lists)")===pat);

    h+=items.map(rowHTML).join("");

  if(capped)h+=`<div class="hintbox" style="margin-top:12px">Showing first ${CAP} of ${total}. Use search to narrow.</div>`;
  return h;
}

const GCFG="lc-gist-cfg", TOMBKEY="lc-tomb", GFILE="leetcode-tracker-state.json";

/* --- merge: never lose work from either device --- */
function pmTime(p){
  if(!p)return 0;
  if(p.mtime){const t=Date.parse(p.mtime);if(t)return t;}
  const d=p.lastReviewed||p.lastDrilled||p.firstSolved;
  if(d){const t=Date.parse(d+"T12:00:00Z");if(t)return t;}
  return 0;
}
function logKey(l){return [l.date||"",l.outcome||"",l.help||"",String(l.note||"").slice(0,90)].join("|");}
function unionLog(a,b){
  const seen={},out=[];
  (a||[]).concat(b||[]).forEach(function(l){if(!l)return;const k=logKey(l);if(!seen[k]){seen[k]=1;out.push(l);}});
  out.sort(function(x,y){return String(y.date||"").localeCompare(String(x.date||""));});
  return out;
}
function pickDate(x,y,newest){
  const v=[x,y].filter(Boolean).sort();
  if(!v.length)return null;
  return newest?v[v.length-1]:v[0];
}
function mergeProblem(a,b){
  if(!a)return b;
  if(!b)return a;
  const ta=pmTime(a), tb=pmTime(b);
  const w=ta>=tb?a:b, l=ta>=tb?b:a;
  const out=Object.assign({},l,w);
  /* written text is precious: never let a blank field overwrite a filled one */
  ["trigger","notes","timeC","spaceC","predictedC"].forEach(function(k){
    if(!String(w[k]||"").trim()&&String(l[k]||"").trim())out[k]=l[k];
  });
  out.attempts=Math.max(a.attempts||0,b.attempts||0);
  out.reviewCount=Math.max(a.reviewCount||0,b.reviewCount||0);
  out.firstSolved=pickDate(a.firstSolved,b.firstSolved,false);
  out.lastReviewed=pickDate(a.lastReviewed,b.lastReviewed,true);
  out.lastDrilled=pickDate(a.lastDrilled,b.lastDrilled,true);
  out.log=unionLog(a.log,b.log);
  out.mtime=new Date(Math.max(ta,tb)||Date.now()).toISOString();
  return out;
}
function mergeStates(a,b){
  const out={},keys={};
  Object.keys(a||{}).forEach(function(k){keys[k]=1;});
  Object.keys(b||{}).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(s){out[s]=mergeProblem((a||{})[s],(b||{})[s]);});
  return out;
}
function mergeTomb(a,b){
  const out=Object.assign({},a||{});
  Object.keys(b||{}).forEach(function(s){if(!out[s]||(Date.parse(b[s])||0)>(Date.parse(out[s])||0))out[s]=b[s];});
  const cut=Date.now()-90*864e5;
  Object.keys(out).forEach(function(s){if((Date.parse(out[s])||0)<cut)delete out[s];});
  return out;
}
function applyTomb(st,tb){
  Object.keys(tb||{}).forEach(function(s){
    const t=Date.parse(tb[s])||0;
    if(st[s]&&pmTime(st[s])<=t)delete st[s];
  });
  return st;
}

/* --- transport --- */
function ghHeaders(){return {"Authorization":"Bearer "+gistCfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};}
async function gistRead(){
  const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(gistCfg.gistId),{method:"GET",headers:ghHeaders(),cache:"no-store"});
  if(r.status===401)throw new Error("token rejected (401) - check it has the gist scope");
  if(r.status===403)throw new Error("forbidden (403) - token lacks the gist scope");
  if(r.status===404)throw new Error("gist not found (404) - check the gist ID");
  if(!r.ok)throw new Error("GitHub returned "+r.status);
  const j=await r.json();
  const f=j.files&&j.files[GFILE];
  if(!f)return null;
  let c=f.content;
  if(f.truncated&&f.raw_url){const rr=await fetch(f.raw_url,{cache:"no-store"});c=await rr.text();}
  if(!c||!String(c).trim())return null;
  try{return JSON.parse(c);}catch(e){throw new Error("remote file is not valid JSON");}
}
async function gistWrite(payload){
  const files={};files[GFILE]={content:JSON.stringify(payload,null,1)};
  const r=await fetch("https://api.github.com/gists/"+encodeURIComponent(gistCfg.gistId),{method:"PATCH",headers:ghHeaders(),body:JSON.stringify({files:files})});
  if(!r.ok)throw new Error("push failed - GitHub returned "+r.status);
}

/* --- orchestration --- */
function paintSync(){
  const dot=document.getElementById("syncDot"), lbl=document.getElementById("syncLbl");
  if(!dot||!lbl)return;
  dot.className="syncdot "+(syncStatus.s==="off"?"":syncStatus.s);
  let t="Cloud";
  if(syncStatus.s==="busy")t="Syncing";
  else if(syncStatus.s==="err")t="Sync error";
  else if(syncStatus.s==="ok")t=syncAt?"Synced "+shortAgo(syncAt):"Synced";
  lbl.textContent=t;
  const btn=document.getElementById("cloudBtn");
  if(btn)btn.title=syncStatus.msg||(syncOn()?"Cloud sync on":"Cloud sync not set up");
}
function shortAgo(ts){
  const s=Math.round((Date.now()-ts)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.round(s/60)+"m ago";
  if(s<86400)return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function setSync(s,msg){syncStatus={s:s,msg:msg||""};if(s==="ok")syncAt=Date.now();paintSync();}
function scheduleSync(){
  if(!syncOn())return;
  if(pushTimer)clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){pushTimer=null;cloudSync();},1500);
}
async function cloudSync(){
  if(!syncOn())return {ok:false,err:"not configured"};
  if(syncing){pendingPush=true;return {ok:false,err:"busy"};}
  syncing=true;setSync("busy");
  let res={ok:true};
  try{
    const remote=await gistRead();
    let merged=state, mtomb=tomb, catChanged=false;
    if(remote&&remote.state){
      merged=mergeStates(state,remote.state);
      mtomb=mergeTomb(tomb,remote.tomb);
      merged=applyTomb(merged,mtomb);
      if(remote.extraCat){
        const before=Object.keys(extraCat).length;
        extraCat=Object.assign({},remote.extraCat,extraCat);
        catChanged=Object.keys(extraCat).length!==before;
      }
    }
    const changed=JSON.stringify(merged)!==JSON.stringify(state)||catChanged;
    state=merged;tomb=mtomb;
    localStorage.setItem(KEY,JSON.stringify(state));
    saveTomb();saveCat();
    await gistWrite({v:1,updatedAt:nowTs(),device:deviceName(),state:state,extraCat:extraCat,tomb:tomb});
    setSync("ok");
    if(changed){buildCat();render();}
  }catch(e){
    res={ok:false,err:String((e&&e.message)||e)};
    setSync("err",res.err);
  }finally{
    syncing=false;
  }
  if(pendingPush){pendingPush=false;scheduleSync();}
  return res;
}

    const tk=document.getElementById("gistTok").value.trim();
    if(!id||!tk){msg("&#9888; Both the gist ID and the token are needed.",false);return;}
    gistCfg={gistId:id,token:tk};saveSyncCfg();
    await run();
  };
  m.querySelector("[data-syncnow]").onclick=run;
  m.querySelector("[data-forget]").onclick=function(){
    if(!confirm("Remove the token from this device? Your data stays, but this device stops syncing."))return;
    gistCfg=null;saveSyncCfg();setSync("off");msg("Token removed from this browser.",true);
  };
}

/* boot */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));
document.getElementById("syncBtn").onclick=openSync;
document.getElementById("cloudBtn").onclick=openCloud;
document.getElementById("exportBtn").onclick=exportData;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=d.state||d;if(d.extraCat){extraCat=d.extraCat;saveCat();}if(d.tomb){tomb=mergeTomb(tomb,d.tomb);saveTomb();}save();buildCat();render();alert("Imported ✅");}catch(err){alert("Couldn't read that file.");}};r.readAsText(f);};
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
loadSyncCfg();
load();buildCat();
if(window.__LC_CATALOG__)ingestCatalog(window.__LC_CATALOG__);
if(window.__LC_SOLVED__&&Array.isArray(window.__LC_SOLVED__))ingestSolved(window.__LC_SOLVED__);
render();
paintSync();
if(syncOn()){setSync("busy");cloudSync();}
setInterval(function(){if(syncStatus.s==="ok")paintSync();},60000);
window.addEventListener("focus",function(){if(syncOn()&&!syncing)cloudSync();});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&syncOn()&&!syncing)cloudSync();});
</script>
</body>
</html>
